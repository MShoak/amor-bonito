<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tarjeta de Regalo - Escanea tu Sorpresa 💖</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Great+Vibes&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      background: radial-gradient(circle at 50% 30%, #2b082e 0%, #130117 100%);
      font-family: 'Outfit', sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .card-container {
      background: linear-gradient(145deg, #ffffff 0%, #fff0f5 100%);
      color: #333;
      width: 100%;
      max-width: 420px;
      border-radius: 28px;
      padding: 38px 28px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), 0 0 40px rgba(255, 42, 109, 0.4);
      border: 4px solid #ff758c;
      position: relative;
      overflow: hidden;
    }
    .card-container::before {
      content: '';
      position: absolute;
      top: -30px;
      right: -30px;
      width: 90px;
      height: 90px;
      background: rgba(255, 42, 109, 0.12);
      border-radius: 50%;
    }
    .card-title {
      font-family: 'Great Vibes', cursive;
      font-size: 3.2rem;
      color: #d81159;
      line-height: 1.1;
      margin-bottom: 6px;
    }
    .card-subtitle {
      font-size: 1.05rem;
      color: #7a1e38;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin-bottom: 24px;
    }
    .qr-frame {
      background: #ffffff;
      padding: 16px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(216, 17, 89, 0.2);
      display: inline-block;
      margin-bottom: 20px;
      border: 2px dashed #ff4b72;
    }
    .qr-frame img {
      width: 220px;
      height: 220px;
      display: block;
      border-radius: 12px;
    }
    .instructions {
      font-size: 0.95rem;
      color: #555;
      line-height: 1.4;
      margin-bottom: 18px;
    }
    .instructions strong {
      color: #d81159;
    }
    .quote {
      font-family: 'Caveat', cursive;
      font-size: 1.8rem;
      color: #b80c41;
      margin-top: 10px;
    }
    .controls {
      margin-top: 25px;
      display: flex;
      gap: 12px;
    }
    .btn {
      background: linear-gradient(135deg, #ff2a6d 0%, #b80c41 100%);
      color: #fff;
      border: none;
      padding: 12px 24px;
      border-radius: 30px;
      font-family: 'Outfit', sans-serif;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(255, 42, 109, 0.4);
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(255, 42, 109, 0.6);
    }
    @media print {
      body {
        background: none;
      }
      .controls {
        display: none;
      }
      .card-container {
        box-shadow: none;
        border: 2px solid #ff758c;
      }
    }
  </style>
</head>
<body>

  <div class="card-container">
    <h1 class="card-title">Para ti</h1>
    <p class="card-subtitle">✨ Abre tu sorpresa especial ✨</p>

    <div class="qr-frame">
      <img src="qr_romantico.png" alt="Código QR Romántico" />
    </div>

    <p class="instructions">
      Apunta con la <strong>cámara de tu celular</strong> a este código QR para abrir el detalle preparado con todo el amor del mundo.
    </p>

    <p class="quote">« Mi amor bonito * Te quiero » 💕</p>
  </div>

  <div class="controls">
    <button class="btn" onclick="window.print()">🖨️ Imprimir Tarjeta</button>
    <a href="index.html" class="btn" style="background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3);">
      👁️ Ver Sorpresa
    </a>
  </div>

</body>
</html>
